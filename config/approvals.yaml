      quedan marcadas "[BORRADOR IA — revisar]" y deben ser completadas,
      corregidas y asumidas por el equipo antes de la entrega del curso.
  audit_release:
    status: "approved"
    approved_by: "Vinicio Arcos"
    approved_at: "2026-07-24"
    notes: >-
      outputs/logs/audit_report.json: status=approved, 0 errores, 0
